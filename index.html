<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐮 奶龙吃月饼 · 中秋小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e3c2c, #2a5a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
        }

        .game-wrapper {
            background: #fbf3e0;
            padding: 20px 20px 25px;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5), inset 0 0 0 2px #ffe9b6;
            border: 5px solid #b48c5c;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px 10px;
        }

        .score-board {
            background: #5e3e1e;
            padding: 10px 25px;
            border-radius: 40px;
            color: #ffefc0;
            font-weight: bold;
            font-size: 1.8rem;
            letter-spacing: 2px;
            box-shadow: inset 0 -5px 0 #3f2a12, 0 6px 0 #3f2a12;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-board span {
            font-size: 1.2rem;
            background: #ffd966;
            color: #3f2a12;
            padding: 2px 12px;
            border-radius: 30px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            min-width: 60px;
            text-align: center;
        }

        .restart-btn {
            background: #e6b87e;
            border: none;
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #3d2b13;
            cursor: pointer;
            box-shadow: 0 7px 0 #9b7a4b, 0 8px 12px rgba(0,0,0,0.2);
            transition: all 0.07s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #9b7a4b, 0 8px 12px rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #9ac78b;
            border-radius: 40px;
            box-shadow: inset 0 0 0 8px #7ba86b, inset 0 0 30px #558b3e, 0 15px 25px #1d2e14;
            cursor: none;
            width: 800px;
            height: 500px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
            font-size: 1.2rem;
            color: #433c2b;
            font-weight: 600;
            background: #eadbba;
            padding: 10px 20px;
            border-radius: 100px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: inset 0 0 0 2px #cfb68b;
        }

        .controls kbd {
            background: #4a3723;
            color: #ffeecc;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 1rem;
            box-shadow: 0 3px 0 #241b10;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: #3d2b13;
            font-weight: 600;
            flex-wrap: wrap;
        }

        .legend span {
            background: #fff8e8;
            padding: 5px 12px;
            border-radius: 30px;
            box-shadow: inset 0 0 0 2px #d8c29e;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend .tag {
            font-weight: bold;
            padding: 1px 7px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .tag-normal { background: #fff0c0; color: #7a5a10; }
        .tag-cook { background: #ffe0e0; color: #b33; }
        .tag-lxy { background: #d6efff; color: #036; }
        .tag-cell { background: #e5ffd6; color: #264; }

        .status-tip {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #6b4a1e;
            font-weight: 600;
            flex-wrap: wrap;
        }

        .status-tip .badge {
            padding: 4px 14px;
            border-radius: 30px;
            background: #ffe6b0;
            box-shadow: inset 0 0 0 2px #d8b56e;
            transition: all 0.3s;
            opacity: 0.4;
        }

        .status-tip .badge.active {
            background: #ffb84d;
            color: #3d2b13;
            opacity: 1;
            box-shadow: inset 0 0 0 2px #cf8a2a, 0 3px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="score-board">
                得分 <span id="scoreDisplay">0</span>
            </div>
            <button class="restart-btn" id="restartButton">
                🔄 再来一局
            </button>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="legend">
            <span><i class="tag tag-normal">正常</i> +1分</span>
            <span><i class="tag tag-cook">烹饪</i> -5分</span>
            <span><i class="tag tag-lxy">lxy</i> +2分</span>
            <span><i class="tag tag-cell">细胞灰</i> +5分</span>
        </div>
        <div class="status-tip">
            <span class="badge" id="speedBadge">⚡ 100分: 速度+30%, 正常→烹饪10%</span>
            <span class="badge" id="speedBadge2">⚡ 500分: 速度+50%, 正常→烹饪30%</span>
        </div>
        <div class="controls">
            <span>← → 移动奶龙</span>
            <kbd>←</kbd>
            <kbd>→</kbd>
        </div>
    </div>

    <script>
        (function(){
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const speedBadge1 = document.getElementById('speedBadge');
            const speedBadge2 = document.getElementById('speedBadge2');

            const CW = 800;
            const CH = 500;

            // 奶龙体型 (身体变大, 头为身体的70%)
            const COW_WIDTH = 150;
            const COW_HEIGHT = 180;
            const COW_Y = CH - COW_HEIGHT - 5;

            // 身体半径 = w * 0.39 (比之前0.30增大了30%)
            // 头半径 = 身体半径 * 0.7 = w * 0.273
            const BODY_R_RATIO = 0.39;
            const HEAD_R_RATIO = BODY_R_RATIO * 0.7;

            let cowX = (CW - COW_WIDTH) / 2;
            let score = 0;
            let mooncakes = [];

            let leftPressed = false;
            let rightPressed = false;
            const MOVE_SPEED = 7;

            const BASE_SPEED = 2.2;
            const SPEED_VARIATION = 1.5;
            const SPAWN_INTERVAL_FRAMES = 38;
            let frameCounter = 0;
            let gameAnimationId = null;

            const MOONCAKE_TYPES = [
                { label: '',        score: 1,  baseProb: 0.60, fill: '#ffe9b0', ring: '#d4a244', textColor: '#7a5a10' },
                { label: '烹饪',    score: -5, baseProb: 0.20, fill: '#f7b6b6', ring: '#c94a4a', textColor: '#8a1a1a' },
                { label: 'lxy',     score: 2,  baseProb: 0.15, fill: '#b8dcff', ring: '#3a7ca8', textColor: '#083b5e' },
                { label: '细胞灰',  score: 5,  baseProb: 0.05, fill: '#c6efb0', ring: '#4c8c3a', textColor: '#1c4a1a' },
            ];

            function getDynamicTypes() {
                const types = MOONCAKE_TYPES.map(t => ({ ...t, prob: t.baseProb }));
                const normal = types[0];
                const cook = types[1];

                let transferRatio = 0;
                if (score >= 500) {
                    transferRatio = 0.30;
                } else if (score >= 100) {
                    transferRatio = 0.10;
                }

                if (transferRatio > 0) {
                    const transferAmount = normal.prob * transferRatio;
                    normal.prob -= transferAmount;
                    cook.prob += transferAmount;
                }
                return types;
            }

            function getSpeedMultiplier() {
                if (score >= 500) return 1.5;
                if (score >= 100) return 1.3;
                return 1.0;
            }

            function pickMooncakeType() {
                const types = getDynamicTypes();
                const r = Math.random();
                let cumulative = 0;
                for (const t of types) {
                    cumulative += t.prob;
                    if (r < cumulative) return t;
                }
                return types[0];
            }

            function updateSpeedBadges() {
                speedBadge1.classList.toggle('active', score >= 100);
                speedBadge2.classList.toggle('active', score >= 500);
            }

            function resetGame() {
                cowX = (CW - COW_WIDTH) / 2;
                score = 0;
                updateScoreDisplay();
                updateSpeedBadges();
                mooncakes = [];
                frameCounter = 0;
                leftPressed = false;
                rightPressed = false;
                if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
                gameLoop();
            }

            function updateScoreDisplay() {
                scoreSpan.textContent = score;
                scoreSpan.style.color = score < 0 ? '#c0392b' : '#3f2a12';
                updateSpeedBadges();
            }

            function spawnMooncake() {
                const radius = 26 + Math.floor(Math.random() * 8);
                const x = Math.random() * (CW - radius * 2) + radius;
                const y = -radius * 2;
                const speedMult = getSpeedMultiplier();
                const speed = (BASE_SPEED + Math.random() * SPEED_VARIATION) * speedMult;
                const rotation = Math.random() * Math.PI * 2;
                const rotSpeed = (Math.random() - 0.5) * 0.03;
                const type = pickMooncakeType();
                mooncakes.push({ x, y, radius, speed, rotation, rotSpeed, type });
            }

            function update() {
                if (leftPressed) cowX -= MOVE_SPEED;
                if (rightPressed) cowX += MOVE_SPEED;
                if (cowX < 0) cowX = 0;
                if (cowX > CW - COW_WIDTH) cowX = CW - COW_WIDTH;

                frameCounter++;
                if (frameCounter >= SPAWN_INTERVAL_FRAMES) {
                    frameCounter = 0;
                    if (Math.random() < 0.85) spawnMooncake();
                }

                // 碰撞区域: 头球 + 身球 (使用新的半径比例)
                const headCX = cowX + COW_WIDTH * 0.5;
                const headCY = COW_Y + COW_HEIGHT * 0.28;
                const headR = COW_WIDTH * HEAD_R_RATIO;

                const bodyCX = cowX + COW_WIDTH * 0.5;
                const bodyCY = COW_Y + COW_HEIGHT * 0.68;
                const bodyR = COW_WIDTH * BODY_R_RATIO;

                for (let i = mooncakes.length - 1; i >= 0; i--) {
                    const mc = mooncakes[i];
                    mc.y += mc.speed;
                    mc.rotation += mc.rotSpeed;

                    const dxH = mc.x - headCX;
                    const dyH = mc.y - headCY;
                    const dxB = mc.x - bodyCX;
                    const dyB = mc.y - bodyCY;

                    const hitHead = (dxH * dxH + dyH * dyH) < (headR + mc.radius) * (headR + mc.radius);
                    const hitBody = (dxB * dxB + dyB * dyB) < (bodyR + mc.radius) * (bodyR + mc.radius);

                    if (hitHead || hitBody) {
                        score += mc.type.score;
                        updateScoreDisplay();
                        mooncakes.splice(i, 1);
                        continue;
                    }

                    if (mc.y - mc.radius > CH + 30) mooncakes.splice(i, 1);
                }
            }

            function drawMooncake(mc) {
                const { x, y, radius, rotation, type } = mc;
                const r = radius;
                const isNormal = type.label === '';

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);

                ctx.shadowColor = 'rgba(80, 40, 0, 0.45)';
                ctx.shadowBlur = 14;
                ctx.shadowOffsetY = 5;

                const bodyGradient = ctx.createRadialGradient(
                    -r * 0.3, -r * 0.2, r * 0.2,
                    0, r * 0.2, r * 1.3
                );
                bodyGradient.addColorStop(0, type.fill);
                bodyGradient.addColorStop(0.6, type.ring);
                bodyGradient.addColorStop(1, shadeColor(type.ring, -30));
                ctx.beginPath();
                ctx.ellipse(0, r * 0.25, r * 0.98, r * 0.85, 0, 0, Math.PI * 2);
                ctx.fillStyle = bodyGradient;
                ctx.fill();

                ctx.shadowBlur = 4;
                ctx.shadowOffsetY = 2;
                ctx.strokeStyle = shadeColor(type.ring, -20);
                ctx.lineWidth = 1.8;
                const spikes = 16;
                for (let i = 0; i < spikes; i++) {
                    const angle = (i / spikes) * Math.PI * 2;
                    const sx = Math.cos(angle) * r * 0.9;
                    const sy = Math.sin(angle) * r * 0.75 + r * 0.25;
                    const ex = Math.cos(angle) * r * 1.0;
                    const ey = Math.sin(angle) * r * 0.85 + r * 0.25;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                }

                const topGradient = ctx.createRadialGradient(
                    -r * 0.2, -r * 0.3, r * 0.1,
                    0, -r * 0.1, r * 1.1
                );
                topGradient.addColorStop(0, shadeColor(type.fill, 30));
                topGradient.addColorStop(0.5, type.fill);
                topGradient.addColorStop(1, shadeColor(type.ring, 10));
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 3;
                ctx.beginPath();
                ctx.ellipse(0, -r * 0.15, r * 0.92, r * 0.78, 0, 0, Math.PI * 2);
                ctx.fillStyle = topGradient;
                ctx.fill();
                ctx.shadowBlur = 5;
                ctx.shadowOffsetY = 2;
                ctx.strokeStyle = shadeColor(type.ring, -20);
                ctx.lineWidth = 2.2;
                ctx.stroke();

                ctx.shadowBlur = 2;
                ctx.shadowOffsetY = 1;
                const petalCount = 12;
                for (let i = 0; i < petalCount; i++) {
                    const angle = (i / petalCount) * Math.PI * 2 + rotation * 0.2;
                    const petalX = Math.cos(angle) * r * 0.72;
                    const petalY = Math.sin(angle) * r * 0.58 - r * 0.15;
                    const petalR = r * 0.22;
                    ctx.beginPath();
                    ctx.ellipse(petalX, petalY, petalR * 0.8, petalR * 1.1, angle, 0, Math.PI * 2);
                    const petalGrad = ctx.createRadialGradient(petalX, petalY, 1, petalX, petalY, petalR);
                    petalGrad.addColorStop(0, shadeColor(type.fill, 40));
                    petalGrad.addColorStop(1, shadeColor(type.ring, -5));
                    ctx.fillStyle = petalGrad;
                    ctx.fill();
                    ctx.strokeStyle = shadeColor(type.ring, -25);
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.ellipse(0, -r * 0.15, r * 0.42, r * 0.38, 0, 0, Math.PI * 2);
                ctx.fillStyle = shadeColor(type.fill, 15);
                ctx.fill();
                ctx.strokeStyle = shadeColor(type.ring, -15);
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, -r * 0.15, r * 0.13, 0, Math.PI * 2);
                ctx.fillStyle = shadeColor(type.ring, 5);
                ctx.fill();
                ctx.strokeStyle = shadeColor(type.ring, -30);
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                if (isNormal) {
                    ctx.save();
                    ctx.rotate(-rotation);
                    const petalR2 = r * 0.13;
                    const cx = 0;
                    const cy = -r * 0.15;
                    ctx.fillStyle = 'rgba(180, 120, 30, 0.55)';
                    for (let i = 0; i < 5; i++) {
                        const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
                        const px = cx + Math.cos(a) * petalR2 * 0.9;
                        const py = cy + Math.sin(a) * petalR2 * 0.9;
                        ctx.beginPath();
                        ctx.arc(px, py, petalR2 * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.beginPath();
                    ctx.arc(cx, cy, petalR2 * 0.55, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(140, 90, 20, 0.7)';
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.rotate(-rotation);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const fontSize = Math.max(11, Math.floor(r * 0.55));
                    ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif`;
                    ctx.fillStyle = type.textColor;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.lineJoin = 'round';
                    ctx.strokeText(type.label, 0, -r * 0.15);
                    ctx.fillText(type.label, 0, -r * 0.15);
                    ctx.restore();
                }

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                ctx.beginPath();
                ctx.ellipse(-r * 0.25, -r * 0.35, r * 0.18, r * 0.1, 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 240, 0.55)';
                ctx.fill();

                ctx.restore();
            }

            function shadeColor(hex, percent) {
                let r = parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(5, 7), 16);
                r = Math.min(255, Math.max(0, r + percent));
                g = Math.min(255, Math.max(0, g + percent));
                b = Math.min(255, Math.max(0, b + percent));
                return `rgb(${r}, ${g}, ${b})`;
            }

            // ---------- 绘制奶龙 (身体变大30%, 头为身体的70%) ----------
            function drawCow() {
                const x = cowX;
                const y = COW_Y;
                const w = COW_WIDTH;
                const h = COW_HEIGHT;

                // 身体半径 (变大30%)
                const bodyR = w * BODY_R_RATIO;
                const bodyCX = x + w * 0.50;
                const bodyCY = y + h * 0.68;

                // 头半径 = 身体半径 * 0.7
                const headR = bodyR * 0.7;
                const headCX = x + w * 0.50;
                const headCY = y + h * 0.28;

                const bodyColor = '#f5b12e';
                const bodyLight = '#ffd75e';
                const bodyDark = '#e0971a';
                const bellyShadow = '#eccf8a';

                ctx.shadowColor = 'rgba(30, 15, 0, 0.4)';
                ctx.shadowBlur = 16;
                ctx.shadowOffsetY = 6;

                // ============================================
                // 身体球体 (更大)
                // ============================================
                const bodyGrad = ctx.createRadialGradient(
                    bodyCX - bodyR * 0.3, bodyCY - bodyR * 0.4, bodyR * 0.1,
                    bodyCX, bodyCY, bodyR * 1.15
                );
                bodyGrad.addColorStop(0, bodyLight);
                bodyGrad.addColorStop(0.6, bodyColor);
                bodyGrad.addColorStop(1, bodyDark);
                ctx.beginPath();
                ctx.arc(bodyCX, bodyCY, bodyR, 0, Math.PI * 2);
                ctx.fillStyle = bodyGrad;
                ctx.fill();
                ctx.strokeStyle = '#cf8217';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 身体高光
                ctx.beginPath();
                ctx.ellipse(bodyCX - bodyR * 0.35, bodyCY - bodyR * 0.40, bodyR * 0.25, bodyR * 0.16, 0.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.30)';
                ctx.fill();

                // 肚皮
                ctx.save();
                ctx.beginPath();
                ctx.arc(bodyCX, bodyCY, bodyR - 2, 0, Math.PI * 2);
                ctx.clip();

                const bellyGrad = ctx.createRadialGradient(
                    bodyCX - bodyR * 0.2, bodyCY - bodyR * 0.2, bodyR * 0.1,
                    bodyCX, bodyCY, bodyR * 0.9
                );
                bellyGrad.addColorStop(0, '#fff4d4');
                bellyGrad.addColorStop(1, bellyShadow);
                ctx.fillStyle = bellyGrad;
                ctx.beginPath();
                ctx.ellipse(bodyCX, bodyCY + bodyR * 0.15, bodyR * 0.72, bodyR * 0.62, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(200, 160, 90, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();

                // ============================================
                // 头球 (为身体半径的70%)
                // ============================================
                ctx.shadowBlur = 16;
                ctx.shadowOffsetY = 5;
                const headGrad = ctx.createRadialGradient(
                    headCX - headR * 0.3, headCY - headR * 0.4, headR * 0.1,
                    headCX, headCY, headR * 1.1
                );
                headGrad.addColorStop(0, '#ffe07a');
                headGrad.addColorStop(0.55, bodyColor);
                headGrad.addColorStop(1, bodyDark);
                ctx.beginPath();
                ctx.arc(headCX, headCY, headR, 0, Math.PI * 2);
                ctx.fillStyle = headGrad;
                ctx.fill();
                ctx.strokeStyle = '#cf8217';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 头部高光
                ctx.beginPath();
                ctx.ellipse(headCX - headR * 0.32, headCY - headR * 0.42, headR * 0.30, headR * 0.18, 0.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.40)';
                ctx.fill();

                // ============================================
                // 眼睛 (小一点, 按新头半径等比调整)
                // ============================================
                const eyeY = headCY - headR * 0.02;
                const eyeOffsetX = headR * 0.38;
                const eyeRX = headR * 0.20;
                const eyeRY = headR * 0.24;

                // 左眼
                ctx.shadowBlur = 5;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(headCX - eyeOffsetX, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2a2a2a';
                ctx.lineWidth = 2;
                ctx.stroke();

                const leftIrisGrad = ctx.createRadialGradient(
                    headCX - eyeOffsetX - eyeRX * 0.15, eyeY - eyeRY * 0.15, 1,
                    headCX - eyeOffsetX, eyeY, eyeRX * 0.75
                );
                leftIrisGrad.addColorStop(0, '#6ab04c');
                leftIrisGrad.addColorStop(0.7, '#3d7a2a');
                leftIrisGrad.addColorStop(1, '#1e4a12');
                ctx.fillStyle = leftIrisGrad;
                ctx.beginPath();
                ctx.arc(headCX - eyeOffsetX, eyeY, eyeRX * 0.68, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(headCX - eyeOffsetX, eyeY, eyeRX * 0.36, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(headCX - eyeOffsetX - eyeRX * 0.18, eyeY - eyeRY * 0.18, eyeRX * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // 右眼
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(headCX + eyeOffsetX, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2a2a2a';
                ctx.lineWidth = 2;
                ctx.stroke();

                const rightIrisGrad = ctx.createRadialGradient(
                    headCX + eyeOffsetX - eyeRX * 0.15, eyeY - eyeRY * 0.15, 1,
                    headCX + eyeOffsetX, eyeY, eyeRX * 0.75
                );
                rightIrisGrad.addColorStop(0, '#6ab04c');
                rightIrisGrad.addColorStop(0.7, '#3d7a2a');
                rightIrisGrad.addColorStop(1, '#1e4a12');
                ctx.fillStyle = rightIrisGrad;
                ctx.beginPath();
                ctx.arc(headCX + eyeOffsetX, eyeY, eyeRX * 0.68, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(headCX + eyeOffsetX, eyeY, eyeRX * 0.36, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(headCX + eyeOffsetX - eyeRX * 0.18, eyeY - eyeRY * 0.18, eyeRX * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // ============================================
                // 露齿笑 + 上嘴唇
                // ============================================
                const mouthY = headCY + headR * 0.52;
                const mouthW = headR * 0.42;
                const mouthH = headR * 0.22;

                // 嘴巴内部 (深色)
                ctx.fillStyle = '#8a3a1a';
                ctx.beginPath();
                ctx.ellipse(headCX, mouthY, mouthW, mouthH, 0, 0, Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#6a2a10';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 一排小白牙
                ctx.fillStyle = '#ffffff';
                const teethCount = 5;
                const toothW = mouthW * 0.32;
                const toothH = mouthH * 0.55;
                for (let i = 0; i < teethCount; i++) {
                    const t = i / (teethCount - 1) - 0.5;
                    const tx = headCX + t * mouthW * 1.1;
                    const ty = mouthY - mouthH * 0.35;
                    ctx.beginPath();
                    ctx.roundRect(tx - toothW / 2, ty, toothW, toothH, 2);
                    ctx.fill();
                }

                // 舌头
                ctx.fillStyle = '#e87a6a';
                ctx.beginPath();
                ctx.ellipse(headCX, mouthY + mouthH * 0.30, mouthW * 0.55, mouthH * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();

                // ============================================
                // 上嘴唇 (覆盖在嘴巴上缘, 白色弧形)
                // ============================================
                ctx.shadowBlur = 3;
                ctx.shadowOffsetY = 1;
                // 上嘴唇主体
                ctx.fillStyle = '#fff8e8';
                ctx.beginPath();
                ctx.moveTo(headCX - mouthW * 1.05, mouthY - mouthH * 0.55);
                ctx.quadraticCurveTo(headCX, mouthY - mouthH * 1.15, headCX + mouthW * 1.05, mouthY - mouthH * 0.55);
                ctx.quadraticCurveTo(headCX + mouthW * 0.95, mouthY - mouthH * 0.35, headCX + mouthW * 0.85, mouthY - mouthH * 0.40);
                ctx.quadraticCurveTo(headCX, mouthY - mouthH * 0.75, headCX - mouthW * 0.85, mouthY - mouthH * 0.40);
                ctx.quadraticCurveTo(headCX - mouthW * 0.95, mouthY - mouthH * 0.35, headCX - mouthW * 1.05, mouthY - mouthH * 0.55);
                ctx.closePath();
                ctx.fill();

                // 上嘴唇描边
                ctx.strokeStyle = '#d8b88a';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 上嘴唇高光
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.ellipse(headCX - mouthW * 0.4, mouthY - mouthH * 0.75, mouthW * 0.25, mouthH * 0.15, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // ============================================
                // 小短手 (连接在身体两侧)
                // ============================================
                ctx.fillStyle = bodyColor;
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;
                ctx.strokeStyle = '#cf8217';
                ctx.lineWidth = 2;

                // 左手
                ctx.beginPath();
                ctx.moveTo(bodyCX - bodyR * 0.95, bodyCY - bodyR * 0.15);
                ctx.quadraticCurveTo(bodyCX - bodyR * 1.15, bodyCY + bodyR * 0.15, bodyCX - bodyR * 0.85, bodyCY + bodyR * 0.30);
                ctx.quadraticCurveTo(bodyCX - bodyR * 0.70, bodyCY + bodyR * 0.20, bodyCX - bodyR * 0.72, bodyCY - bodyR * 0.05);
                ctx.quadraticCurveTo(bodyCX - bodyR * 0.80, bodyCY - bodyR * 0.18, bodyCX - bodyR * 0.95, bodyCY - bodyR * 0.15);
                ctx.fill();
                ctx.stroke();

                // 右手
                ctx.beginPath();
                ctx.moveTo(bodyCX + bodyR * 0.95, bodyCY - bodyR * 0.15);
                ctx.quadraticCurveTo(bodyCX + bodyR * 1.15, bodyCY + bodyR * 0.15, bodyCX + bodyR * 0.85, bodyCY + bodyR * 0.30);
                ctx.quadraticCurveTo(bodyCX + bodyR * 0.70, bodyCY + bodyR * 0.20, bodyCX + bodyR * 0.72, bodyCY - bodyR * 0.05);
                ctx.quadraticCurveTo(bodyCX + bodyR * 0.80, bodyCY - bodyR * 0.18, bodyCX + bodyR * 0.95, bodyCY - bodyR * 0.15);
                ctx.fill();
                ctx.stroke();

                // 小爪子
                ctx.fillStyle = '#c47a1a';
                ctx.beginPath();
                ctx.arc(bodyCX - bodyR * 0.92, bodyCY + bodyR * 0.28, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX - bodyR * 0.82, bodyCY + bodyR * 0.32, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX + bodyR * 0.92, bodyCY + bodyR * 0.28, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX + bodyR * 0.82, bodyCY + bodyR * 0.32, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // ============================================
                // 小短腿 / 脚
                // ============================================
                ctx.fillStyle = bodyColor;
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 4;
                ctx.strokeStyle = '#cf8217';
                ctx.lineWidth = 2;

                // 左腿
                ctx.beginPath();
                ctx.moveTo(bodyCX - bodyR * 0.55, bodyCY + bodyR * 0.85);
                ctx.quadraticCurveTo(bodyCX - bodyR * 0.60, bodyCY + bodyR * 1.20, bodyCX - bodyR * 0.35, bodyCY + bodyR * 1.25);
                ctx.quadraticCurveTo(bodyCX - bodyR * 0.10, bodyCY + bodyR * 1.25, bodyCX - bodyR * 0.05, bodyCY + bodyR * 1.05);
                ctx.quadraticCurveTo(bodyCX - bodyR * 0.15, bodyCY + bodyR * 0.85, bodyCX - bodyR * 0.55, bodyCY + bodyR * 0.85);
                ctx.fill();
                ctx.stroke();

                // 右腿
                ctx.beginPath();
                ctx.moveTo(bodyCX + bodyR * 0.55, bodyCY + bodyR * 0.85);
                ctx.quadraticCurveTo(bodyCX + bodyR * 0.60, bodyCY + bodyR * 1.20, bodyCX + bodyR * 0.35, bodyCY + bodyR * 1.25);
                ctx.quadraticCurveTo(bodyCX + bodyR * 0.10, bodyCY + bodyR * 1.25, bodyCX + bodyR * 0.05, bodyCY + bodyR * 1.05);
                ctx.quadraticCurveTo(bodyCX + bodyR * 0.15, bodyCY + bodyR * 0.85, bodyCX + bodyR * 0.55, bodyCY + bodyR * 0.85);
                ctx.fill();
                ctx.stroke();

                // 脚趾小爪子
                ctx.fillStyle = '#c47a1a';
                ctx.beginPath();
                ctx.arc(bodyCX - bodyR * 0.42, bodyCY + bodyR * 1.22, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX - bodyR * 0.30, bodyCY + bodyR * 1.25, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX - bodyR * 0.18, bodyCY + bodyR * 1.22, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(bodyCX + bodyR * 0.42, bodyCY + bodyR * 1.22, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX + bodyR * 0.30, bodyCY + bodyR * 1.25, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bodyCX + bodyR * 0.18, bodyCY + bodyR * 1.22, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }

            function draw() {
                ctx.clearRect(0, 0, CW, CH);

                ctx.fillStyle = '#6f9e5c';
                for (let i = 0; i < 8; i++) {
                    let x = (i * 130 + 40) % CW;
                    ctx.beginPath();
                    ctx.ellipse(x, CH - 20, 40, 15, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#5a8349';
                    ctx.fill();
                }

                ctx.fillStyle = '#e0f0d0';
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.ellipse(120, 70, 60, 30, 0, 0, Math.PI * 2);
                ctx.ellipse(180, 50, 50, 30, 0, 0, Math.PI * 2);
                ctx.ellipse(60, 50, 50, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(620, 100, 70, 28, 0, 0, Math.PI * 2);
                ctx.ellipse(690, 80, 50, 30, 0, 0, Math.PI * 2);
                ctx.ellipse(560, 80, 50, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                mooncakes.forEach(mc => drawMooncake(mc));
                drawCow();

                ctx.font = 'bold 30px "Segoe UI", "PingFang SC", sans-serif';
                ctx.fillStyle = '#fef7e0';
                ctx.shadowColor = '#3a2c1c';
                ctx.shadowBlur = 10;
                ctx.fillText('得分 ' + score, 40, 70);
                ctx.shadowBlur = 0;
            }

            function gameLoop() {
                update();
                draw();
                gameAnimationId = requestAnimationFrame(gameLoop);
            }

            function handleKeyDown(e) {
                const key = e.key;
                if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
                    leftPressed = true;
                    e.preventDefault();
                } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
                    rightPressed = true;
                    e.preventDefault();
                }
            }

            function handleKeyUp(e) {
                const key = e.key;
                if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
                    leftPressed = false;
                    e.preventDefault();
                } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
                    rightPressed = false;
                    e.preventDefault();
                }
            }

            window.addEventListener('keydown', function(e) {
                if (e.key.startsWith('Arrow') || e.key === 'a' || e.key === 'A' || e.key === 'd' || e.key === 'D') {
                    e.preventDefault();
                }
            }, false);

            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            document.getElementById('restartButton').addEventListener('click', resetGame);

            resetGame();

            window.addEventListener('beforeunload', function() {
                if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
            });

        })();
    </script>
</body>
</html>
